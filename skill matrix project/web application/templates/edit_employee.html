
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee - SkillMatrix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f0ff;
            padding: 25px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }
        h2 { text-align: center; color: #5636a5; }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea { resize: vertical; }
        button, .back {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            background: #7655c8;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Employee</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <label>Employee ID</label>
        <input type="text" name="emp_id"
               value="{{ employee['emp_id'] }}" required>

        <label>Employee Name</label>
        <input type="text" name="name"
               value="{{ employee['name'] }}" required>

        <label>Department</label>
        <input type="text" name="department"
               value="{{ employee['department'] or '' }}" required>

        <label>Designation</label>
        <input type="text" name="designation"
               value="{{ employee['designation'] or '' }}" required>

        <label>Employee Skills</label>
        <textarea name="skills" rows="3" required>{{ employee['skills'] }}</textarea>

        <button type="submit">Update Employee</button>
    </form>

    <a class="back" href="{{ url_for('view_employees') }}">Back to Employees</a>
</div>

</body>
</html>
